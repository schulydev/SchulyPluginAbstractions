name: Auto release on main

# Fires only when the shipped backend DLLs actually change. Other commits
# (docs, sync-version bumps, csproj tweaks) won't cut a release.
on:
  push:
    branches: [main]
    paths:
      - 'src/Schuly.Plugin.Abstractions/libs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAIN_PUSH_TOKEN }}

      - name: Compute next patch version from application.properties
        id: ver
        run: |
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' application.properties)
          IFS=. read -r MA MI PA <<< "$CURRENT"
          NEXT="$MA.$MI.$((PA+1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT  →  Next: $NEXT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.next }}" \
            --title "v${{ steps.ver.outputs.next }}" \
            --notes "Auto-release: backend DLLs changed @ ${{ github.sha }}."
